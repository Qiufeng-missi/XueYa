<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="血压心率">
<title>血压心率记录</title>
<style>
  :root{
    --blue:#2b6cb0; --blue-d:#1f4f80; --red:#e53e3e; --green:#38a169; --purple:#805ad5;
    --bg:#f4f6f9; --card:#ffffff; --text:#1a202c; --muted:#718096; --line:#e2e8f0;
    --shadow:0 2px 10px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text);}
  body{padding-bottom:env(safe-area-inset-bottom);}
  .wrap{max-width:560px; margin:0 auto; padding:12px 14px 90px;}
  header{position:sticky; top:0; z-index:10; background:var(--blue); color:#fff; padding:14px 16px; border-radius:14px; box-shadow:var(--shadow); margin-bottom:14px;}
  header h1{margin:0; font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px;}
  header p{margin:4px 0 0; font-size:12px; opacity:.85;}
  .card{background:var(--card); border-radius:14px; padding:14px; box-shadow:var(--shadow); margin-bottom:14px;}
  .card h2{margin:0 0 12px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:6px;}
  label{display:block; font-size:13px; color:var(--muted); margin:0 0 5px;}
  .row{display:flex; gap:10px; margin-bottom:12px;}
  .row > div{flex:1;}
  input[type=date],input[type=time],input[type=number]{
    width:100%; padding:11px 10px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text);
  }
  input:focus{outline:none; border-color:var(--blue);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 14px; border:none; border-radius:11px; font-size:15px; font-weight:600; cursor:pointer; width:100%; transition:.15s;}
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:active{background:var(--blue-d);}
  .btn-ghost{background:#edf2f7; color:var(--text);}
  .btn-danger{background:#fff5f5; color:var(--red); border:1px solid #fed7d7;}
  .stats{display:flex; gap:10px;}
  .stat{flex:1; background:#f7fafc; border:1px solid var(--line); border-radius:12px; padding:12px 10px; text-align:center;}
  .stat .v{font-size:22px; font-weight:800; line-height:1.1;}
  .stat .l{font-size:11px; color:var(--muted); margin-top:4px;}
  .stat.s .v{color:var(--red);} .stat.d .v{color:var(--blue);} .stat.h .v{color:var(--purple);}
  .toggles{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
  .toggles label{display:flex; align-items:center; gap:6px; color:var(--text); font-size:13px; cursor:pointer; margin:0;}
  .toggles input{width:18px; height:18px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .chart-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  canvas{display:block;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:24px 0;}
  .list-item{display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .li-main{flex:1; min-width:0;}
  .li-date{font-size:14px; font-weight:600;}
  .li-sub{font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:10px; flex-wrap:wrap;}
  .badge{font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600;}
  .b-norm{background:#e6fffa; color:#2c7a7b;} .b-elev{background:#fefcbf; color:#b7791f;}
  .b-1{background:#feebc8; color:#c05621;} .b-2{background:#fed7d7; color:#c53030;}
  .li-del{background:none; border:none; color:var(--red); font-size:20px; padding:6px 8px; cursor:pointer;}
  .actions{display:flex; gap:10px; margin-top:6px;}
  .hint{font-size:12px; color:var(--muted); line-height:1.6; background:#f7fafc; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:6px;}
  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:rgba(26,32,44,.92); color:#fff; padding:11px 18px; border-radius:24px; font-size:14px; opacity:0; transition:.25s; z-index:99; pointer-events:none; max-width:90%;}
  .toast.show{opacity:1;}
  section{scroll-margin-top:10px;}
</style>
</head>
<body>
<header>
  <h1>❤️ 血压心率记录</h1>
  <p>每天记录，追踪趋势 · 数据存于本机，可导出备份</p>
</header>

<div class="wrap">

  <!-- 录入 -->
  <div class="card">
    <h2>➕ 新增记录</h2>
    <div class="row">
      <div><label>日期</label><input type="date" id="inDate"></div>
      <div><label>时间</label><input type="time" id="inTime"></div>
    </div>
    <div class="row">
      <div><label>高压 (收缩压 mmHg)</label><input type="number" id="inSys" inputmode="numeric" placeholder="如 120"></div>
      <div><label>低压 (舒张压 mmHg)</label><input type="number" id="inDia" inputmode="numeric" placeholder="如 80"></div>
    </div>
    <div class="row">
      <div><label>心率 (次/分)</label><input type="number" id="inHr" inputmode="numeric" placeholder="如 72"></div>
      <div style="display:flex; align-items:flex-end;"><button class="btn btn-ghost" id="btnNow" style="width:auto; padding:11px 12px;">现在</button></div>
    </div>
    <button class="btn btn-primary" id="btnSave">保存记录</button>
  </div>

  <!-- 概览 -->
  <div class="card">
    <h2>📊 最近概览</h2>
    <div class="stats" id="stats"></div>
  </div>

  <!-- 走势图 -->
  <div class="card">
    <h2>📈 连续走势图</h2>
    <div class="toggles">
      <label><input type="checkbox" id="tSys" checked><span class="dot" style="background:var(--red)"></span>高压</label>
      <label><input type="checkbox" id="tDia" checked><span class="dot" style="background:var(--blue)"></span>低压</label>
      <label><input type="checkbox" id="tHr" checked><span class="dot" style="background:var(--purple)"></span>心率</label>
    </div>
    <div class="chart-scroll" id="chartWrap">
      <canvas id="chart"></canvas>
    </div>
    <p class="hint" id="chartHint">横向可滑动查看更早的日期。</p>
  </div>

  <!-- 记录列表 -->
  <div class="card">
    <h2>📋 全部记录 <span id="cnt" style="color:var(--muted);font-weight:400;font-size:13px;"></span></h2>
    <div id="list"></div>
  </div>

  <!-- 导出/导入 -->
  <div class="card">
    <h2>💾 数据备份</h2>
    <div class="actions">
      <button class="btn btn-ghost" id="btnCsv">导出 CSV</button>
      <button class="btn btn-ghost" id="btnJson">导出 JSON</button>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnImport">导入备份</button>
      <button class="btn btn-danger" id="btnClear">清空全部</button>
    </div>
    <input type="file" id="fileInput" accept=".json,.csv" style="display:none">
    <p class="hint">建议每次备份后保存一份 CSV/JSON 到手机，换手机或重装时可「导入备份」恢复。CSV 可直接用 Excel 打开。</p>
  </div>

  <p class="hint" style="text-align:center;">
    本应用为单文件网页，可点浏览器菜单「添加到主屏幕」当作 App 使用。<br>
    所有数据仅保存在本机浏览器，不会上传。
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "bp_hr_records_v1";
  var $ = function(id){ return document.getElementById(id); };

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
  function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},1800); }

  function nowParts(){
    var d=new Date(); var p=function(n){return (n<10?"0":"")+n;};
    return { date:d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()), time:p(d.getHours())+":"+p(d.getMinutes()) };
  }

  // 血压分级 (基于中国指南简化)
  function bpLevel(sys,dia){
    if(sys>=140 || dia>=90) return {t:"偏高(2级)",c:"b-2"};
    if(sys>=130 || dia>=85) return {t:"偏高(1级)",c:"b-1"};
    if(sys>=120) return {t:"正常高值",c:"b-elev"};
    if(sys>=90 && dia>=60) return {t:"正常",c:"b-norm"};
    return {t:"偏低",c:"b-1"};
  }

  function render(){
    var recs = load().slice().sort(function(a,b){ return (a.dt<b.dt?-1:(a.dt>b.dt?1:0)); });
    renderStats(recs);
    drawChart(recs);
    renderList(recs);
  }

  function renderStats(recs){
    var box=$("stats");
    if(!recs.length){ box.innerHTML='<div class="stat" style="flex:1"><div class="v" style="color:var(--muted)">—</div><div class="l">暂无数据</div></div>'; return; }
    var last=recs[recs.length-1];
    var sumS=0,sumD=0,sumH=0,n=recs.length;
    recs.forEach(function(r){ sumS+=r.sys; sumD+=r.dia; sumH+=r.hr; });
    box.innerHTML =
      '<div class="stat s"><div class="v">'+last.sys+'</div><div class="l">最新高压</div></div>'+
      '<div class="stat d"><div class="v">'+last.dia+'</div><div class="l">最新低压</div></div>'+
      '<div class="stat h"><div class="v">'+last.hr+'</div><div class="l">最新心率</div></div>'+
      '<div class="stat"><div class="v" style="font-size:15px;padding-top:5px">'+Math.round(sumS/n)+'/'+Math.round(sumD/n)+'</div><div class="l">平均血压</div></div>';
  }

  function renderList(recs){
    var box=$("list"); $("cnt").textContent = recs.length?("("+recs.length+"条)"):"";
    if(!recs.length){ box.innerHTML='<div class="empty">还没有记录，先在上方添加一条吧～</div>'; return; }
    // 倒序展示（最新在上）
    var html="";
    for(var i=recs.length-1;i>=0;i--){
      var r=recs[i]; var lv=bpLevel(r.sys,r.dia);
      html+='<div class="list-item" data-id="'+r.id+'">'+
        '<div class="li-main">'+
          '<div class="li-date">'+r.date+' <span style="color:var(--muted);font-weight:400">'+r.time+'</span></div>'+
          '<div class="li-sub"><span style="color:var(--red)">高压 '+r.sys+'</span><span style="color:var(--blue)">低压 '+r.dia+'</span><span style="color:var(--purple)">心率 '+r.hr+'</span><span class="badge '+lv.c+'">'+lv.t+'</span></div>'+
        '</div>'+
        '<button class="li-del" data-del="'+r.id+'" aria-label="删除">🗑</button>'+
      '</div>';
    }
    box.innerHTML=html;
  }

  function drawChart(recs){
    var canvas=$("chart"); var ctx=canvas.getContext("2d");
    var wrap=$("chartWrap");
    if(!recs.length){
      wrap.innerHTML='<div class="empty">暂无数据，添加记录后这里会出现走势图</div>';
      return;
    }
    var showSys=$("tSys").checked, showDia=$("tDia").checked, showHr=$("tHr").checked;

    var cssW=Math.max(wrap.clientWidth||320, recs.length*46 + 50);
    var cssH=280;
    var dpr=window.devicePixelRatio||1;
    canvas.style.width=cssW+"px"; canvas.style.height=cssH+"px";
    canvas.width=Math.round(cssW*dpr); canvas.height=Math.round(cssH*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,cssW,cssH);

    var padL=42,padR=12,padT=16,padB=46;
    var plotW=cssW-padL-padR, plotH=cssH-padT-padB;

    // y 范围
    var vals=[];
    recs.forEach(function(r){ if(showSys)vals.push(r.sys); if(showDia)vals.push(r.dia); if(showHr)vals.push(r.hr); });
    if(!vals.length){ wrap.innerHTML='<div class="empty">请至少勾选一项指标</div>'; return; }
    var minV=Math.min.apply(null,vals), maxV=Math.max.apply(null,vals);
    minV=Math.floor((minV-6)/10)*10; maxV=Math.ceil((maxV+6)/10)*10;
    if(maxV-minV<20){ maxV=minV+20; }

    var n=recs.length;
    function xAt(i){ return padL + (n===1?plotW/2:(plotW*i/(n-1))); }
    function yAt(v){ return padT + plotH - plotH*((v-minV)/(maxV-minV)); }

    // 网格 + y 轴刻度
    ctx.strokeStyle="#eef2f7"; ctx.lineWidth=1; ctx.fillStyle="#9aa5b1"; ctx.font="11px sans-serif";
    var steps=4;
    for(var s=0;s<=steps;s++){
      var yv=minV+(maxV-minV)*s/steps; var yy=yAt(yv);
      ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(padL+plotW,yy); ctx.stroke();
      ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(Math.round(yv), padL-6, yy);
    }
    // x 轴日期标签（抽稀）
    ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillStyle="#9aa5b1";
    var labelEvery=Math.ceil(n/7);
    for(var i=0;i<n;i++){
      if(i%labelEvery===0 || i===n-1){
        var dd=recs[i].date.slice(5); // MM-DD
        ctx.fillText(dd, xAt(i), padT+plotH+8);
      }
    }

    function line(key,color){
      ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
      for(var i=0;i<n;i++){
        var x=xAt(i), y=yAt(recs[i][key]);
        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
      // 数据点
      ctx.fillStyle=color;
      for(var j=0;j<n;j++){ ctx.beginPath(); ctx.arc(xAt(j),yAt(recs[j][key]),2.5,0,Math.PI*2); ctx.fill(); }
    }
    if(showSys) line("sys","#e53e3e");
    if(showDia) line("dia","#2b6cb0");
    if(showHr)  line("hr","#805ad5");
  }

  // 保存
  $("btnSave").addEventListener("click",function(){
    var sys=parseInt($("inSys").value,10), dia=parseInt($("inDia").value,10), hr=parseInt($("inHr").value,10);
    var date=$("inDate").value, time=$("inTime").value;
    if(!date||!time){ toast("请填写日期和时间"); return; }
    if(isNaN(sys)||isNaN(dia)||isNaN(hr)){ toast("请填写完整的数值"); return; }
    if(sys<40||sys>300||dia<20||dia>200||hr<20||hr>250){ toast("数值似乎超出合理范围"); return; }
    var recs=load();
    recs.push({ id:Date.now()+"_"+Math.random().toString(36).slice(2,7), date:date, time:time, dt:date+" "+time, sys:sys, dia:dia, hr:hr });
    save(recs);
    $("inSys").value=""; $("inDia").value=""; $("inHr").value="";
    render();
    toast("已保存 ✓");
    document.querySelector(".wrap").scrollIntoView({behavior:"smooth"});
  });

  // 现在
  $("btnNow").addEventListener("click",function(){
    var p=nowParts(); $("inDate").value=p.date; $("inTime").value=p.time;
  });

  // 删除（事件委托）
  $("list").addEventListener("click",function(e){
    var btn=e.target.closest("[data-del]"); if(!btn) return;
    var id=btn.getAttribute("data-del");
    if(confirm("确定删除这条记录？")){
      save(load().filter(function(r){return r.id!==id;}));
      render(); toast("已删除");
    }
  });

  // 图表开关
  ["tSys","tDia","tHr"].forEach(function(id){ $(id).addEventListener("change",function(){ drawChart(load().slice().sort(function(a,b){return a.dt<b.dt?-1:1;})); }); });

  // 导出 CSV
  $("btnCsv").addEventListener("click",function(){
    var recs=load(); if(!recs.length){ toast("没有可导出的数据"); return; }
    var head="日期,时间,高压(mmHg),低压(mmHg),心率(次/分)\n";
    var body=recs.map(function(r){ return [r.date,r.time,r.sys,r.dia,r.hr].join(","); }).join("\n");
    var blob=new Blob(["\ufeff"+head+body],{type:"text/csv;charset=utf-8"});
    download(blob,"血压心率记录_"+nowParts().date+".csv","text/csv;charset=utf-8");
    toast("CSV 已导出");
  });

  // 导出 JSON
  $("btnJson").addEventListener("click",function(){
    var recs=load(); if(!recs.length){ toast("没有可导出的数据"); return; }
    var blob=new Blob([JSON.stringify({app:"bp-hr-recorder",exportedAt:new Date().toISOString(),records:recs},null,2)],{type:"application/json"});
    download(blob,"血压心率记录_"+nowParts().date+".json","application/json");
    toast("JSON 已导出");
  });

  function download(blob,name,mime){
    // App 内（Android WebView）：走原生桥接，用系统分享/存到下载
    if(window.Android && window.Android.saveFile){
      var reader=new FileReader();
      reader.onload=function(){
        var b64=(reader.result||"").split(",")[1]||"";
        try{ window.Android.saveFile(name,b64,mime||"application/octet-stream"); }
        catch(e){ toast("导出失败"); }
      };
      reader.readAsDataURL(blob);
      return;
    }
    // 浏览器：直接下载
    var url=URL.createObjectURL(blob); var a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },100);
  }

  // 导入
  $("btnImport").addEventListener("click",function(){ $("fileInput").click(); });
  $("fileInput").addEventListener("change",function(e){
    var f=e.target.files[0]; if(!f) return;
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var data, recs;
        if(f.name.toLowerCase().endsWith(".json")){
          data=JSON.parse(reader.result); recs=data.records||data;
        }else{
          var lines=reader.result.replace(/^\ufeff/,"").trim().split(/\r?\n/);
          recs=lines.slice(1).filter(function(l){return l.trim();}).map(function(l){
            var c=l.split(","); return {id:Date.now()+"_"+Math.random().toString(36).slice(2,7),date:c[0],time:c[1],dt:c[0]+" "+c[1],sys:+c[2],dia:+c[3],hr:+c[4]};
          });
        }
        if(!Array.isArray(recs)) throw new Error("格式不正确");
        // 合并去重（按 日期+时间）
        var exist=load(); var seen={};
        exist.forEach(function(r){ seen[r.date+" "+r.time]=r; });
        var added=0;
        recs.forEach(function(r){ var k=r.date+" "+r.time; if(!seen[k]){ exist.push(r); seen[k]=r; added++; } });
        save(exist); render();
        toast("导入完成，新增 "+added+" 条");
      }catch(err){ toast("导入失败：文件格式无法识别"); }
      e.target.value="";
    };
    reader.readAsText(f);
  });

  // 清空
  $("btnClear").addEventListener("click",function(){
    if(!load().length){ toast("没有数据可清空"); return; }
    if(confirm("确定清空全部记录？此操作不可恢复，建议先导出备份。")){
      localStorage.removeItem(KEY); render(); toast("已清空");
    }
  });

  // 初始化
  (function init(){
    var p=nowParts(); $("inDate").value=p.date; $("inTime").value=p.time;
    render();
    window.addEventListener("resize",function(){ drawChart(load().slice().sort(function(a,b){return a.dt<b.dt?-1:1;})); });
  })();
})();
</script>
</body>
</html>
